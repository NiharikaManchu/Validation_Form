<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Form Validation</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .form-container {
        background: #1e293b;
        padding: 25px;
        width: 340px;
        border-radius: 10px;
        color: #fff;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    label {
        font-size: 14px;
        margin-top: 10px;
        display: block;
    }

    input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border-radius: 5px;
        border: 2px solid transparent;
        outline: none;
        transition: border 0.3s;
    }

    .valid {
        border-color: #22c55e;
    }

    .invalid {
        border-color: #ef4444;
    }

    .password-box {
        position: relative;
    }

    .toggle {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 12px;
        color: #93c5fd;
    }

    .error {
        font-size: 12px;
        color: #f87171;
        margin-top: 3px;
    }

    .strength-bar {
        height: 6px;
        width: 100%;
        background: #334155;
        border-radius: 4px;
        margin-top: 6px;
        overflow: hidden;
    }

    .strength {
        height: 100%;
        width: 0%;
        transition: width 0.3s;
    }

    .weak { background: #ef4444; }
    .medium { background: #facc15; }
    .strong { background: #22c55e; }

    button {
        margin-top: 18px;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 5px;
        background: #3b82f6;
        color: #fff;
        cursor: pointer;
    }

    button:hover {
        background: #2563eb;
    }
</style>
</head>
<body>

<div class="form-container">
    <h2>Form Validation</h2>

    <form id="myForm">

        <label>Full Name</label>
        <input type="text" id="name">
        <div class="error" id="nameMsg"></div>

        <label>Email</label>
        <input type="text" id="email">
        <div class="error" id="emailMsg"></div>

        <label>Password</label>
        <div class="password-box">
            <input type="password" id="password">
            <span class="toggle" onclick="togglePassword('password', this)">Show</span>
        </div>

        <div class="strength-bar">
            <div class="strength" id="strengthBar"></div>
        </div>
        <div class="error" id="passwordMsg"></div>

        <label>Confirm Password</label>
        <div class="password-box">
            <input type="password" id="confirmPassword">
            <span class="toggle" onclick="togglePassword('confirmPassword', this)">Show</span>
        </div>
        <div class="error" id="confirmMsg"></div>

        <button type="submit">Submit</button>
    </form>
</div>

<script>
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const strengthBar = document.getElementById("strengthBar");

    nameInput.addEventListener("input", validateName);
    emailInput.addEventListener("input", validateEmail);
    passwordInput.addEventListener("input", validatePassword);
    confirmInput.addEventListener("input", validateConfirm);

    function validateName() {
        if (nameInput.value.trim() === "") {
            setInvalid(nameInput, "Name is required", "nameMsg");
        } else {
            setValid(nameInput, "nameMsg");
        }
    }

    function validateEmail() {
        const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (emailInput.value.trim() === "") {
            setInvalid(emailInput, "Email is required", "emailMsg");
        } else if (!pattern.test(emailInput.value)) {
            setInvalid(emailInput, "Invalid email format", "emailMsg");
        } else {
            setValid(emailInput, "emailMsg");
        }
    }

    function validatePassword() {
        const value = passwordInput.value;
        let strength = 0;

        if (value.length >= 8) strength++;
        if (/[A-Z]/.test(value)) strength++;
        if (/[0-9]/.test(value)) strength++;
        if (/[^A-Za-z0-9]/.test(value)) strength++;

        strengthBar.className = "strength";
        passwordInput.classList.remove("valid", "invalid");

        if (value.length === 0) {
            strengthBar.style.width = "0%";
            document.getElementById("passwordMsg").textContent = "";
            return;
        }

        if (strength <= 1) {
            strengthBar.style.width = "25%";
            strengthBar.classList.add("weak");
            setInvalid(passwordInput, "Weak password", "passwordMsg");
        } else if (strength <= 3) {
            strengthBar.style.width = "60%";
            strengthBar.classList.add("medium");
            setInvalid(passwordInput, "Medium strength password", "passwordMsg");
        } else {
            strengthBar.style.width = "100%";
            strengthBar.classList.add("strong");
            setValid(passwordInput, "passwordMsg");
        }

        validateConfirm();
    }

    function validateConfirm() {
        if (confirmInput.value === "") {
            confirmInput.classList.remove("valid", "invalid");
            document.getElementById("confirmMsg").textContent = "";
        } else if (confirmInput.value !== passwordInput.value) {
            setInvalid(confirmInput, "Passwords do not match", "confirmMsg");
        } else {
            setValid(confirmInput, "confirmMsg");
        }
    }

    function setInvalid(input, message, msgId) {
        input.classList.add("invalid");
        input.classList.remove("valid");
        document.getElementById(msgId).textContent = message;
    }

    function setValid(input, msgId) {
        input.classList.add("valid");
        input.classList.remove("invalid");
        document.getElementById(msgId).textContent = "";
    }

    function togglePassword(id, el) {
        const input = document.getElementById(id);
        if (input.type === "password") {
            input.type = "text";
            el.textContent = "Hide";
        } else {
            input.type = "password";
            el.textContent = "Show";
        }
    }

    document.getElementById("myForm").addEventListener("submit", function(e) {
        e.preventDefault();

        validateName();
        validateEmail();
        validatePassword();
        validateConfirm();

        if (
            document.querySelectorAll(".invalid").length === 0 &&
            nameInput.value &&
            emailInput.value &&
            passwordInput.value &&
            confirmInput.value
        ) {
            alert("Form submitted successfully");
            this.reset();
            strengthBar.style.width = "0%";
        }
    });
</script>

</body>
</html>
